# Эксплораторно (В9): длина перегрузки в протоколе B = 400 и 2000 (в основном 1000). 12 активных ячеек
# (R1, R2 x FIFO x D x S), протокол B, сетка ρ 0,20..1,00 шаг 0,05, R = 40.
stage: explor
tag: x_ol
base_config: configs/base_r1_fifo_off_exp.yaml
set: {proto.trigger_mult: 1.5, proto.trigger_len: 25.0, proto.overload_len: 1000.0}
sweep:
  R: [R1, R2]
  Q: [FIFO]
  D: ["off", "on"]
  S: [Exp, LogN, Pareto]
variants:
  - {name: ol400, set: {proto.overload_len: 400.0}, protocols: [B]}
  - {name: ol2000, set: {proto.overload_len: 2000.0}, protocols: [B]}
rho_parts:
  - {start: 0.20, stop: 1.00, step: 0.05}
replicates: 40
