# Опорная конфигурация (R1, FIFO, D=off, S=Exp). Значения MODEL_SPEC §3-§4 стартовые;
# триггер (trigger_mult, trigger_len) калибруется на pilot (seeds 0-99999) и замораживается на G3.
c: 8
K: 128
T: 10.0
